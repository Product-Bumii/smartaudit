# Dedicated MongoDB instance for SmartAudit (separate from any other MongoDB on the host).
# Single-node replica set (needed for transactions), local only, with authentication.
storage:
  dbPath: /var/lib/mongodb-smartaudit
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod-smartaudit.log
net:
  port: 27018
  bindIp: 127.0.0.1
replication:
  replSetName: rs0
security:
  authorization: enabled
  keyFile: /etc/mongod-smartaudit.key
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
